<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chess Coach settings</title>
    <style>
      body { font: 14px system-ui, sans-serif; padding: 16px; min-width: 300px; }
      label { display: block; margin-bottom: 12px; }
      input { display: block; width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
      button { padding: 6px 12px; }
      #saved { color: #2f6f4f; margin-left: 8px; }
    </style>
  </head>
  <body>
    <label>Your chess.com username <input id="username" /></label>
    <label>Chess Coach app URL <input id="appUrl" placeholder="http://localhost:5173/" /></label>
    <button id="save">Save</button><span id="saved"></span>
    <script src="options.js"></script>
  </body>
</html>
